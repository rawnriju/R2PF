
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
      <title>Rawn Abraham Riju — Fullstack Software Engineer</title>
      <meta name="description" content="Portfolio of Rawn Abraham Riju, fullstack software engineer &amp; MSc student — production React and Node.js work, projects, and resume." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // Apply the saved theme before first paint, otherwise a light-mode
        // visitor gets a dark flash on every load. Dark is the default.
        (function () {
          var t = "dark";
          try { t = localStorage.getItem("r2pf-theme") === "light" ? "light" : "dark"; } catch (e) {}
          document.documentElement.classList.add(t);
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
